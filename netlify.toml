[build]
  command = "pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"

# Next marks prerendered pages must-revalidate, so every page view reached the
# function even though the durable cache already held the page: 100% of
# requests to /help, /party and the rest were function invocations. The pages
# carry no per-visitor data, so a shared cache serves them all.
[[headers]]
  for = "/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, durable, s-maxage=600, stale-while-revalidate=86400"

# Netlify hands the source image's headers to the /_next/image result, so a
# rule on the transformation endpoint never applies: an earlier /_next/image*
# rule sat here doing nothing. Rules on the files themselves cover both the
# original request and the optimized one. Unlike everything under
# /_next/static, these names carry no content hash, so a day is as long as a
# replaced file should keep serving from a browser.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Netlify-CDN-Cache-Control = "public, durable, s-maxage=2592000"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Netlify-CDN-Cache-Control = "public, durable, s-maxage=2592000"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Netlify-CDN-Cache-Control = "public, durable, s-maxage=2592000"

# Deploy Preview에서만 프록시 설정 (CORS 우회)
[context.deploy-preview.environment]
  NEXT_PUBLIC_API_URL = "/api/proxy"
  NEXT_PUBLIC_LLM_BASE_URL = "/api/llm"

[context.deploy-preview]
  # 일반 API 프록시
  [[redirects]]
    from = "/api/proxy/*"
    to = "https://api.tinyclover.com/:splat"
    status = 200
    force = true

# LLM API는 Edge Function으로 프록시 (SSE 스트리밍 지원)
[[edge_functions]]
  path = "/api/llm/*"
  function = "llm-proxy"